name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx astro check
        continue-on-error: true # tighten once @astrojs/check warnings are cleared
      - name: Build
        run: npm run build
        env:
          PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          PUBLIC_EASEBUZZ_KEY: placeholder-key
          PUBLIC_EASEBUZZ_MODE: sandbox
          ASTRO_KEY: ${{ secrets.ASTRO_KEY || 'ci-only-key-not-real-0000000000000000' }}

  e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Smoke tests (chromium only — DB-backed flows need live credentials)
        run: npx playwright test tests/e2e/homepage.spec.ts tests/e2e/seo.spec.ts --project=chromium
        env:
          PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          PUBLIC_EASEBUZZ_KEY: placeholder-key
          PUBLIC_EASEBUZZ_MODE: sandbox
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7