[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Catalog HTML is cached at the edge and invalidated via the
# Netlify-Cache-Tags: products header (see integrations/cache-middleware.mjs).
# Admin mutations purge the tag through integrations/cache-netlify.mjs.

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/checkout/*"
  [headers.values]
    Cache-Control = "private, no-store"
